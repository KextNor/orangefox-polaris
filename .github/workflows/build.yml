name: Build OrangeFox Recovery for polaris

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Display disk space
        run: df -h

      - name: Free up disk space
        run: |
          echo "=== Freeing up disk space ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/azure-pipelines
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/go
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/local/lib/heroku
          sudo rm -rf /usr/local/share/powershell
          sudo apt-get clean
          sudo apt-get autoremove -y
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Install build dependencies
        run: |
          # Add deadsnakes PPA for Python 2 (required by OrangeFox build)
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y \
            git-core python2.7 python3 git-lfs aria2 \
            zlib1g-dev openjdk-11-jdk libssl-dev libncurses5 \
            bison flex gperf libxml2-utils lz4 \
            lib32ncurses5-dev lib32z1 lib32stdc++6 zip \
            libncurses5-dev libtinfo5 libssl-dev \
            build-essential bc cpio
          # Set python2 as default python (required by OrangeFox build)
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python2
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python
          python --version
          java -version

          # Install repo tool (required by OrangeFox sync script)
          mkdir -p $HOME/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > $HOME/.bin/repo
          chmod a+rx $HOME/.bin/repo
          echo "export PATH=$HOME/.bin:$PATH" >> $HOME/.bashrc
          export PATH=$HOME/.bin:$PATH
          repo --version

      - name: Sync OrangeFox sources (fox_12.1)
        run: |
          export PATH=$HOME/.bin:$PATH
          cd $HOME
          git clone https://gitlab.com/OrangeFox/sync.git OrangeFox_sync
          cd OrangeFox_sync
          ./orangefox_sync.sh --branch 12.1 --path $HOME/fox_12.1
          echo "=== Sync complete ==="
          df -h

      - name: Setup device tree
        run: |
          cd $HOME/fox_12.1
          mkdir -p device/xiaomi
          # Clone official polaris tree (contains prebuilt kernel)
          git clone --depth=1 https://gitlab.com/OrangeFox/device/polaris.git -b fox_12.1 device/xiaomi/polaris
          # Copy custom device tree files from this repo (overrides official)
          cp -f $GITHUB_WORKSPACE/Android.mk device/xiaomi/polaris/
          cp -f $GITHUB_WORKSPACE/AndroidProducts.mk device/xiaomi/polaris/
          cp -f $GITHUB_WORKSPACE/BoardConfig.mk device/xiaomi/polaris/
          cp -f $GITHUB_WORKSPACE/board-info.txt device/xiaomi/polaris/
          cp -f $GITHUB_WORKSPACE/twrp_polaris.mk device/xiaomi/polaris/
          cp -f $GITHUB_WORKSPACE/vendorsetup.sh device/xiaomi/polaris/
          echo "=== Device tree setup complete ==="
          ls -la device/xiaomi/polaris/

      - name: Build OrangeFox Recovery
        run: |
          cd $HOME/fox_12.1
          set +e
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=polaris
          export LC_ALL="C"
          echo "=== Sourcing envsetup.sh ==="
          source build/envsetup.sh
          echo "=== envsetup.sh done, exit: $? ==="
          echo "=== Running lunch ==="
          lunch twrp_polaris-eng
          echo "=== lunch done, exit: $? ==="
          echo "=== Starting build ==="
          mka adbd recoveryimage 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== Build exit code: $BUILD_EXIT ==="
          echo "=== Disk space after build ==="
          df -h
          exit $BUILD_EXIT

      - name: Show build output
        if: always()
        run: |
          ls -lh $HOME/fox_12.1/out/target/product/polaris/*.img 2>/dev/null || echo "No .img files found"
          ls -lh $HOME/fox_12.1/out/target/product/polaris/*.zip 2>/dev/null || echo "No .zip files found"
          echo "=== Last 100 lines of build log ==="
          tail -100 $HOME/fox_12.1/build.log 2>/dev/null || echo "No build log"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp -f $HOME/fox_12.1/out/target/product/polaris/*.img $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          cp -f $HOME/fox_12.1/out/target/product/polaris/*.zip $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          cp -f $HOME/fox_12.1/out/target/product/polaris/*.md5 $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          cp -f $HOME/fox_12.1/build.log $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          ls -lh $GITHUB_WORKSPACE/artifacts/

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-polaris
          path: |
            artifacts/*.img
            artifacts/*.zip
            artifacts/*.md5
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: artifacts/build.log
          retention-days: 7

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          # 统计已有 Fix 前缀的 release 数量，自动递增
          n=$(gh release list --limit 200 --json tagName --jq '[.[] | select(.tagName | startswith("Fix"))] | length')
          n=$((n+1))
          tag="Fix${n}-v12.0_1-polaris"
          echo "Creating release: $tag"
          gh release create "$tag" \
            artifacts/*.img artifacts/*.zip artifacts/*.md5 \
            --title "OrangeFox R12.0_1 (${tag}) - Xiaomi Mi MIX 2S (polaris)" \
            --notes "OrangeFox Recovery R12.0_1 (Unofficial) for Xiaomi Mi MIX 2S (polaris)

          - Base: OrangeFox fox_12.1 sources (FOX_INTERNAL_RELEASE R12.0)
          - Maintainer: ZiLing_Fox
          - Build: GitHub Actions / ubuntu-22.04 / commit ${GITHUB_SHA}

          Install:
          - fastboot flash recovery OrangeFox-R12.0_1-Unofficial-polaris.img
          - or flash the .zip from an existing recovery"

