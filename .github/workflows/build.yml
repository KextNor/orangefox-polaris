name: Build OrangeFox Recovery for polaris

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Display disk space
        run: df -h

      - name: Free up disk space
        run: |
          echo "=== Freeing up disk space ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/azure-pipelines
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/go
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/local/lib/heroku
          sudo rm -rf /usr/local/share/powershell
          sudo apt-get clean
          sudo apt-get autoremove -y
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/install-dependencies.log"
          report_result() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              tail -100 "$log" || true
              summary=$(tail -5 "$log" | tr '\n' ' ' | cut -c1-1200)
              echo "::error::Dependency installation failed (exit $rc): $summary"
            else
              tail -20 "$log"
            fi
          }
          trap report_result EXIT
          {
            # Stop background package updates without killing dpkg mid-transaction.
            sudo systemctl disable --now apt-daily.timer apt-daily-upgrade.timer || true
            sudo systemctl stop apt-daily.service apt-daily-upgrade.service unattended-upgrades.service || true
            sudo dpkg --configure -a
            # Add deadsnakes directly. add-apt-repository queries Launchpad's API,
            # which hung for 18 minutes and ended in RemoteDisconnected on run #27.
            sudo apt-get -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 update
            curl -fsSL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 60 \
              "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF23C5A6CF475977595C89F51BA6932366A755776" \
              | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/deadsnakes.gpg
            echo "deb [signed-by=/usr/share/keyrings/deadsnakes.gpg] https://ppa.launchpadcontent.net/deadsnakes/ppa/ubuntu jammy main" \
              | sudo tee /etc/apt/sources.list.d/deadsnakes.list
            sudo apt-get -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 update
            sudo apt-get -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 install -y \
              git-core python2.7 python3 git-lfs aria2 \
              zlib1g-dev openjdk-11-jdk libssl-dev libncurses5 \
              bison flex gperf libxml2-utils lz4 \
              lib32ncurses5-dev lib32z1 lib32stdc++6 zip \
              libncurses5-dev libtinfo5 libssl-dev \
              build-essential bc cpio
            # Set python2 as default python (required by OrangeFox build)
            sudo ln -sf /usr/bin/python2.7 /usr/bin/python2
            sudo ln -sf /usr/bin/python2.7 /usr/bin/python
            python --version
            java -version

            # Install repo tool (required by OrangeFox sync script)
            mkdir -p $HOME/.bin
            curl https://storage.googleapis.com/git-repo-downloads/repo > $HOME/.bin/repo
            chmod a+rx $HOME/.bin/repo
            echo "export PATH=$HOME/.bin:$PATH" >> $HOME/.bashrc
            export PATH=$HOME/.bin:$PATH
            repo --version
          } >"$log" 2>&1

      - name: Sync OrangeFox sources (fox_12.1)
        run: |
          export PATH=$HOME/.bin:$PATH
          cd $HOME
          # Use official OrangeFox sync script (optimized: shallow clone + parallel)
          # Note: removed --ssh flag (GitHub Actions doesn't have GitLab SSH key)
          git clone https://gitlab.com/OrangeFox/Misc.git $HOME/of-misc
          bash $HOME/of-misc/orangefox_sync.sh --branch 12.1 --path $HOME/fox_12.1
          echo "=== Sync complete ==="
          df -h

      - name: Setup device tree
        run: |
          cd $HOME/fox_12.1
          mkdir -p device/xiaomi
          # Clone official polaris tree (contains prebuilt kernel)
          git clone --depth=1 https://gitlab.com/OrangeFox/device/polaris.git -b fox_12.1 device/xiaomi/polaris
          # Clone the common tree now; Patch fstab runs before lunch would fetch it.
          git clone --depth=1 https://gitlab.com/OrangeFox/device/sdm845-common.git -b fox_12.1 device/xiaomi/sdm845-common
          # Copy custom device tree files from this repo (overrides official)
          cp -f $GITHUB_WORKSPACE/Android.mk device/xiaomi/polaris/
          cp -f $GITHUB_WORKSPACE/AndroidProducts.mk device/xiaomi/polaris/
          cp -f $GITHUB_WORKSPACE/BoardConfig.mk device/xiaomi/polaris/
          cp -f $GITHUB_WORKSPACE/board-info.txt device/xiaomi/polaris/
          cp -f $GITHUB_WORKSPACE/twrp_polaris.mk device/xiaomi/polaris/
          cp -f $GITHUB_WORKSPACE/vendorsetup.sh device/xiaomi/polaris/
          echo "=== Device tree setup complete ==="
          ls -la device/xiaomi/polaris/

      - name: Customize theme (avatar + credits)
        run: |
          cd $HOME/fox_12.1
          # 1) About 页面的维护者头像：主题资源 Default/About/maintainer.png
          echo "=== Avatar targets ==="
          find bootable/recovery/gui/theme -path "*About/maintainer.png" -print
          find bootable/recovery/gui/theme -path "*About/maintainer.png" -exec cp -f $GITHUB_WORKSPACE/avatar.png {} \;

          # 2) Credits：定位 "R12 interface refresh" 所在文件并插入维护者名字
          #    动态读取匹配行的前导空白并继承它，确保与官方原文对齐（顶格显示）。
          echo "=== Credits candidates ==="
          hits=$(grep -rl "R12 interface refresh" bootable vendor device 2>/dev/null | head -5)
          echo "$hits"
          for f in $hits; do
            # 打印原文件缩进信息方便排障
            echo "--- original indent in $f ---"
            grep -B1 -A2 "R12 interface refresh" "$f" | cat -A
            awk '{
              indent = $0;
              sub(/[^ \t].*/, "", indent);
              print;
              if (/R12 interface refresh/) {
                print indent "ZiLing_Fox (polaris maintainer)"
              }
            }' "$f" > "$f.new" && mv "$f.new" "$f"
            echo "patched: $f"
            grep -B1 -A6 "R12 interface refresh" "$f"
          done

      - name: Patch OrangeFox source (fix dynamic partition detection for bootdevice path)
        run: |
          set -e
          PM_FILE="bootable/recovery/partitionmanager.cpp"
          [ -f "$PM_FILE" ] || { echo "::error::partitionmanager.cpp not found"; exit 1; }
          cp "$PM_FILE" "$PM_FILE.bak"
          echo "=== Patching Get_Super_Partition() to check bootdevice path ==="
          # Original code returns "/dev/block/by-name/" + super_device
          # But polaris uses "/dev/block/bootdevice/by-name/" (with 'bootdevice' subdirectory)
          # Patch: check bootdevice path first, fallback to standard path
          python3 << 'PYEOF'
          import re
          with open("bootable/recovery/partitionmanager.cpp", "r") as f:
              content = f.read()
          
          # Find Get_Super_Partition() function
          old_func = '''std::string TWPartitionManager::Get_Super_Partition() {
          	int slot_number = Get_Active_Slot_Display() == "A" ? 0 : 1;
          	std::string super_device = fs_mgr_get_super_partition_name(slot_number);
          	return "/dev/block/by-name/" + super_device;
          }'''
          
          new_func = '''std::string TWPartitionManager::Get_Super_Partition() {
          	int slot_number = Get_Active_Slot_Display() == "A" ? 0 : 1;
          	std::string super_device = fs_mgr_get_super_partition_name(slot_number);
          	// Fix for polaris and Xiaomi devices: check bootdevice path first
          	std::string bootdevice_path = "/dev/block/bootdevice/by-name/" + super_device;
          	if (access(bootdevice_path.c_str(), F_OK) == 0) {
          		return bootdevice_path;
          	}
          	return "/dev/block/by-name/" + super_device;
          }'''
          
          if old_func in content:
              content = content.replace(old_func, new_func)
              with open("bootable/recovery/partitionmanager.cpp", "w") as f:
                  f.write(content)
              print("PATCHED: Get_Super_Partition() now checks bootdevice path")
          else:
              print("WARNING: Get_Super_Partition() pattern not found, checking if already patched...")
              if "bootdevice_path" in content:
                  print("Already patched!")
              else:
                  print("ERROR: Could not find function to patch")
                  exit(1)
          PYEOF
          echo "=== Verify patch ==="
          grep -A10 "Get_Super_Partition()" "$PM_FILE" | head -15

      - name: Patch fstab (add wipeingui to dynamic partitions)
        run: |
          set -e
          FSTAB_DIR="device/xiaomi/sdm845-common/recovery/kernel_44/fstab_files"
          FSTAB="$FSTAB_DIR/recovery-dynamic.fstab"
          [ -f "$FSTAB" ] || FSTAB=$(find device/xiaomi/sdm845-common -name 'recovery-dynamic.fstab' | head -1)
          [ -f "$FSTAB" ] || { echo "::error::recovery-dynamic.fstab not found"; exit 1; }
          echo "Found: $FSTAB"
          cp "$FSTAB" "$FSTAB.bak"

          # Add 'wipeingui' to dynamic partitions so they show up in Wipe UI.
          # CRITICAL: keep 'logical' flag! Do NOT add 'formattable'!
          #
          # polaris uses RETROFIT dynamic partitions. The super metadata lives at
          # the START of the physical 'system' partition. If we remove 'logical'
          # and add 'formattable', OrangeFox treats system/vendor as physical
          # partitions and mkfs.ext4 writes directly to them, OVERWRITING super
          # metadata -> device hangs on OrangeFox splash (Fix4/Fix5 bug).
          #
          # With 'logical' kept, OrangeFox uses /dev/block/mapper/system (dm device)
          # for wipe/format. mkfs.ext4 on a dm device does NOT touch the physical
          # partition's super metadata -> SAFE.
          #
          # R11 (fox_9.0_Q_SAR) had System/Vendor/Cust in Wipe UI because polaris
          # was NOT dynamic-partitioned back then. R12 retrofit changed that.
          # Adding 'wipeingui' restores the R11 Wipe UI experience safely.

          for part in system system_ext product vendor odm; do
            awk -v part="$part" '
              /^[[:space:]]*#/ { print; next }
              NF >= 5 && $1 == part && /logical/ {
                $NF = $NF ",wipeingui"
                print "  [wipeingui] " part > "/dev/stderr"
                print; next
              }
              { print }
            ' "$FSTAB.bak" > "$FSTAB.tmp" && mv "$FSTAB.tmp" "$FSTAB"
          done

          echo "=== Patched fstab (dynamic partitions with wipeingui) ==="
          grep -E '^(system|system_ext|product|vendor|odm)' "$FSTAB" || true

          BAD=0
          for part in system system_ext product vendor odm; do
            LINE=$(grep -E "^$part[[:space:]]" "$FSTAB" || true)
            if [ -n "$LINE" ]; then
              echo "$LINE" | grep -q 'logical' || { echo "::error::$part missing logical!"; BAD=1; }
              echo "$LINE" | grep -q 'wipeingui' || { echo "::error::$part missing wipeingui!"; BAD=1; }
              echo "$LINE" | grep -q 'formattable' && { echo "::error::$part has formattable (DANGEROUS)!"; BAD=1; }
            fi
          done
          [ "$BAD" -eq 0 ] || { echo "::error::fstab patch validation failed"; exit 1; }
          echo "fstab patch OK: all dynamic partitions have logical+wipeingui, no formattable"

      - name: Build OrangeFox Recovery
        run: |
          cd $HOME/fox_12.1
          set +e
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=polaris
          export LC_ALL="C"
          echo "=== Sourcing envsetup.sh ==="
          source build/envsetup.sh
          echo "=== envsetup.sh done, exit: $? ==="
          echo "=== Running lunch ==="
          lunch twrp_polaris-eng
          echo "=== lunch done, exit: $? ==="
          echo "=== Starting build ==="
          mka adbd recoveryimage 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== Build exit code: $BUILD_EXIT ==="
          echo "=== Disk space after build ==="
          df -h
          exit $BUILD_EXIT

      - name: Show build output
        if: always()
        run: |
          ls -lh $HOME/fox_12.1/out/target/product/polaris/*.img 2>/dev/null || echo "No .img files found"
          ls -lh $HOME/fox_12.1/out/target/product/polaris/*.zip 2>/dev/null || echo "No .zip files found"
          echo "=== Exact image size (bytes) ==="
          stat -c '%n %s' $HOME/fox_12.1/out/target/product/polaris/*.img 2>/dev/null || echo "n/a"
          echo "=== Last 100 lines of build log ==="
          tail -100 $HOME/fox_12.1/build.log 2>/dev/null || echo "No build log"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp -f $HOME/fox_12.1/out/target/product/polaris/OrangeFox-*.img $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          cp -f $HOME/fox_12.1/out/target/product/polaris/OrangeFox-*.zip $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          cp -f $HOME/fox_12.1/out/target/product/polaris/OrangeFox-*.md5 $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          cp -f $HOME/fox_12.1/build.log $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          ls -lh $GITHUB_WORKSPACE/artifacts/

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-polaris
          path: |
            artifacts/*.img
            artifacts/*.zip
            artifacts/*.md5
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: artifacts/build.log
          retention-days: 7

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          shopt -s nullglob
          files=(artifacts/*.img artifacts/*.zip artifacts/*.md5)
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有可发布的产物，跳过 release"
            exit 0
          fi
          ls -l "${files[@]}"
          # 统计已有 Fix 前缀的 release 数量，自动递增
          n=$(gh release list --limit 200 --json tagName --jq '[.[] | select(.tagName | startswith("Fix"))] | length')
          n=$((n+1))
          tag="Fix${n}-v12.0_1-polaris"

          # 本次更新：列出上一个 Release 到当前提交之间的改动
          prev_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          changes=""
          if [ -n "$prev_tag" ]; then
            changes=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_SHA}" \
              --jq '.commits[] | "- " + (.commit.message | split("\n")[0]) + " (" + .sha[0:7] + ")"' 2>/dev/null || true)
          fi
          if [ -z "$changes" ]; then
            changes="- 维护性更新，详见提交历史"
          fi

          {
            echo "## 本次更新"
            echo
            echo "${changes}"
            echo
            echo "## 说明"
            echo
            echo "适用于 Xiaomi Mi MIX 2S（polaris）的 OrangeFox Recovery R12.0_1 非官方构建。"
            echo
            echo "- 源码基线：OrangeFox \`fox_12.1\`（FOX_INTERNAL_RELEASE R12.0）"
            echo "- 维护者：ZiLing_Fox"
            echo "- 构建：GitHub Actions / ubuntu-22.04 / commit ${GITHUB_SHA}"
            echo
            echo "## 刷入方式"
            echo
            echo '```bash'
            echo "fastboot erase recovery"
            echo "fastboot flash recovery OrangeFox-R12.0_1-Unofficial-polaris.img"
            echo "fastboot reboot recovery"
            echo '```'
            echo
            echo "也可以在已有的 Recovery 中直接刷入 .zip，刷入前建议用附带的 .md5 校验。"
            echo
            echo "> 注意：cust 分区在动态分区 ROM 上属于 super 的组成块，格式化会破坏系统，请谨慎操作。"
            echo "> 遇到问题请带上日志提 Issue：https://github.com/KextNor/orangefox-polaris/issues/new?template=bug_report.yml"
          } > release-notes.md

          echo "Creating release: $tag"
          gh release create "$tag" "${files[@]}" \
            --title "OrangeFox R12.0_1 (${tag}) - Xiaomi Mi MIX 2S (polaris)" \
            --notes-file release-notes.md

