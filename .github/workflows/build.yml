      - name: Patch fstab (add wipeingui to dynamic partitions)
        run: |
          set -e
          cd $HOME/fox_16.0
          FSTAB_DIR="device/xiaomi/sdm845-common/recovery/kernel_44/fstab_files"
          FSTAB="$FSTAB_DIR/recovery-dynamic.fstab"
          [ -f "$FSTAB" ] || FSTAB=$(find device/xiaomi/sdm845-common -name 'recovery-dynamic.fstab' | head -1)
          [ -f "$FSTAB" ] || { echo "::error::recovery-dynamic.fstab not found"; exit 1; }
          echo "Found: $FSTAB"
          cp "$FSTAB" "$FSTAB.bak"

          # Add 'wipeingui' to dynamic partitions so they show up in Wipe UI.
          # CRITICAL: keep 'logical' flag! Do NOT add 'formattable'!
          #
          # polaris uses RETROFIT dynamic partitions. The super metadata lives at
          # the START of the physical 'system' partition. If we remove 'logical'
          # and add 'formattable', OrangeFox treats system/vendor as physical
          # partitions and mkfs.ext4 writes directly to them, OVERWRITING super
          # metadata -> device hangs on OrangeFox splash (Fix4/Fix5 bug).
          #
          # With 'logical' kept, OrangeFox uses the dm device returned by fs_mgr
          # (for example /dev/block/dm-0) for wipe/format. mkfs.ext4 on that dm
          # device does NOT touch the physical partition's super metadata -> SAFE.
          #
          # R11 (fox_9.0_Q_SAR) had System/Vendor/Cust in Wipe UI because polaris
          # was NOT dynamic-partitioned back then. R12 retrofit changed that.
          # Adding 'wipeingui' restores the R11 Wipe UI experience safely.

          for part in system system_ext product vendor odm; do
            awk -v part="$part" '
              /^[[:space:]]*#/ { print; next }
              NF >= 5 && $1 == part && /logical/ {
                $NF = $NF ",wipeingui"
                print "  [wipeingui] " part > "/dev/stderr"
                print; next
              }
              { print }
            ' "$FSTAB" > "$FSTAB.tmp" && mv "$FSTAB.tmp" "$FSTAB"
          done

          echo "=== Patched fstab (dynamic partitions with wipeingui) ==="
          grep -E '^(system|system_ext|product|vendor|odm)' "$FSTAB" || true

          BAD=0
          for part in system system_ext product vendor odm; do
            LINE=$(grep -E "^$part[[:space:]]" "$FSTAB" || true)
            if [ -n "$LINE" ]; then
              echo "$LINE" | grep -q 'logical' || { echo "::error::$part missing logical!"; BAD=1; }
              echo "$LINE" | grep -q 'wipeingui' || { echo "::error::$part missing wipeingui!"; BAD=1; }
              echo "$LINE" | grep -q 'formattable' && { echo "::error::$part has formattable (DANGEROUS)!"; BAD=1; }
            fi
          done
          [ "$BAD" -eq 0 ] || { echo "::error::fstab patch validation failed"; exit 1; }
          echo "fstab patch OK: all dynamic partitions have logical+wipeingui, no formattable"

      - name: Configure swap
        run: |
          free -h
          FREEG=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free disk: ${FREEG}G"
          if [ "$FREEG" -gt 15 ]; then
            sudo fallocate -l 6G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=6144 status=none
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile > /dev/null
            sudo swapon /swapfile && echo "swap enabled: 6G"
          else
            echo "skip swap: only ${FREEG}G free"
          fi
          free -h

      - name: Build OrangeFox Recovery
        run: |
          cd $HOME/fox_16.0
          set +e
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=polaris
          export LC_ALL="C"
          echo "=== Sourcing envsetup.sh ==="
          source build/envsetup.sh
          echo "=== envsetup.sh done, exit: $? ==="
          echo "=== Running lunch ==="
          lunch twrp_polaris-bp2a-eng
          LUNCH_EXIT=$?
          echo "=== lunch done, exit: $LUNCH_EXIT ==="
          if [ "$LUNCH_EXIT" -ne 0 ]; then
            exit "$LUNCH_EXIT"
          fi
          echo "=== Starting build ==="
          mka -j3 recoveryimage 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== Build exit code: $BUILD_EXIT ==="
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "=== Last 300 lines of failed build log ==="
            tail -300 build.log || true
          fi
          echo "=== Disk space after build ==="
          df -h
          exit $BUILD_EXIT

      - name: Show build output
        if: always()
        run: |
          ls -lh $HOME/fox_16.0/out/target/product/polaris/*.img 2>/dev/null || echo "No .img files found"
          ls -lh $HOME/fox_16.0/out/target/product/polaris/*.zip 2>/dev/null || echo "No .zip files found"
          echo "=== Exact image size (bytes) ==="
          stat -c '%n %s' $HOME/fox_16.0/out/target/product/polaris/*.img 2>/dev/null || echo "n/a"
          echo "=== Last 100 lines of build log ==="
          tail -100 $HOME/fox_16.0/build.log 2>/dev/null || echo "No build log"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp -f $HOME/fox_16.0/out/target/product/polaris/OrangeFox-*.img $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          cp -f $HOME/fox_16.0/out/target/product/polaris/OrangeFox-*.zip $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          cp -f $HOME/fox_16.0/out/target/product/polaris/OrangeFox-*.md5 $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          cp -f $HOME/fox_16.0/build.log $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          ls -lh $GITHUB_WORKSPACE/artifacts/

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-polaris-fox16
          path: |
            artifacts/*.img
            artifacts/*.zip
            artifacts/*.md5
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: artifacts/build.log
          retention-days: 7

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          shopt -s nullglob
          files=(artifacts/*.img artifacts/*.zip artifacts/*.md5)
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有可发布的产物，跳过 release"
            exit 0
          fi
          ls -l "${files[@]}"
          # 统计已有 Fix 前缀的 release 数量，自动递增
          n=$(gh release list --limit 200 --json tagName --jq '[.[] | select(.tagName | startswith("Fix"))] | length')
          n=$((n+1))
          tag="Fix${n}-fox_16.0-polaris"

          # 本次更新：列出上一个 Release 到当前提交之间的改动
          prev_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          changes=""
          if [ -n "$prev_tag" ]; then
            changes=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_SHA}" \
              --jq '.commits[] | "- " + (.commit.message | split("\n")[0]) + " (" + .sha[0:7] + ")"' 2>/dev/null || true)
          fi
          if [ -z "$changes" ]; then
            changes="- 维护性更新，详见提交历史"
          fi
          recovery_img=$(basename "$(find artifacts -maxdepth 1 -type f -name 'OrangeFox-*.img' -print -quit)")

          {
            echo "## 本次更新"
            echo
            echo "${changes}"
            echo
            echo "## 说明"
            echo
            echo "适用于 Xiaomi Mi MIX 2S（polaris）的 OrangeFox Recovery fox_16.0 实验性非官方构建。"
            echo
            echo "- 源码基线：OrangeFox \`fox_16.0\`（上游 FOX_INTERNAL_RELEASE 仍为 R12.0）"
            echo "- 维护者：ZiLing_Fox"
            echo "- 构建：GitHub Actions / ubuntu-22.04 / commit ${GITHUB_SHA}"
            echo
            echo "## 刷入方式"
            echo
            echo '```bash'
            echo "fastboot erase recovery"
            echo "fastboot flash recovery ${recovery_img}"
            echo "fastboot reboot recovery"
            echo '```'
            echo
            echo "也可以在已有的 Recovery 中直接刷入 .zip，刷入前建议用附带的 .md5 校验。"
            echo
            echo "> 注意：cust 分区在动态分区 ROM 上属于 super 的组成块，格式化会破坏系统，请谨慎操作。"
            echo "> 遇到问题请带上日志提 Issue：https://github.com/KextNor/orangefox-polaris/issues/new?template=bug_report.yml"
          } > release-notes.md

          echo "Creating release: $tag"
          gh release create "$tag" "${files[@]}" \
            --title "OrangeFox fox_16.0 Experimental (${tag}) - Xiaomi Mi MIX 2S (polaris)" \
            --notes-file release-notes.md

